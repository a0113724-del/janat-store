<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقارير الطلبات — جنة الفواكه والخضار</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#153122; --forest-2:#1E4530;
    --leaf:#3E7A44; --gold:#C99A2E; --gold-light:#E9CD86;
    --paper:#F6F1E1; --card:#FFFFFF;
    --pomegranate:#A13A2E; --ink:#1C2A1D;
    --line: rgba(62,122,68,.18);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Tajawal', sans-serif; background:var(--paper); color:var(--ink); line-height:1.5; padding-bottom:50px; }
  .display{ font-family:'Aref Ruqaa', serif; }

  .topbar{
    background:linear-gradient(180deg, var(--forest), var(--forest-2)); color:var(--gold-light);
    padding:18px 20px; text-align:center; position:sticky; top:0; z-index:20;
  }
  .topbar h1{ font-size:1.25rem; }
  .topbar .status-row{ display:flex; align-items:center; justify-content:center; gap:6px; font-size:.74rem; color:#ccc; margin-top:4px; }
  .dot{ width:8px; height:8px; border-radius:50%; background:#3ecf6a; animation: blink 1.6s infinite; }
  @keyframes blink{ 50%{ opacity:.3; } }
  .sound-toggle{
    margin-top:10px; background:var(--gold); color:var(--forest); border:none;
    padding:9px 20px; border-radius:100px; font-weight:800; font-size:.8rem; cursor:pointer;
  }
  .sound-toggle.on{ background:#25D366; color:#fff; }

  .tabs{ display:flex; gap:8px; max-width:900px; margin:16px auto 0; padding:0 16px; }
  .tabs button{
    flex:1; background:var(--card); border:1.5px solid var(--line); color:var(--ink);
    padding:11px; border-radius:12px; font-weight:800; font-size:.86rem; cursor:pointer;
  }
  .tabs button.active{ background:var(--leaf); color:#fff; border-color:var(--leaf); }

  .view{ display:none; }
  .view.active{ display:block; }

  .setup-box{
    max-width:700px; margin:20px auto; background:#FFF3D6; border:1.5px dashed var(--gold);
    border-radius:14px; padding:18px; font-size:.85rem; text-align:center;
  }

  .stats-row{
    max-width:900px; margin:20px auto; padding:0 16px;
    display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px;
  }
  .stat-card{
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; text-align:center;
  }
  .stat-card .lbl{ font-size:.76rem; color:#888; margin-bottom:6px; }
  .stat-card .val{ font-size:1.5rem; font-weight:900; color:var(--forest); }
  .stat-card .val.money{ color:var(--pomegranate); }

  .section{ max-width:900px; margin:24px auto; padding:0 16px; }
  .section h2{ font-size:1.05rem; color:var(--forest); margin-bottom:12px; }

  .bar-chart{ display:flex; align-items:flex-end; gap:8px; height:140px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .bar-chart .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .bar-chart .bar{ width:100%; max-width:28px; background:var(--leaf); border-radius:4px 4px 0 0; min-height:2px; }
  .bar-chart .bar-label{ font-size:.62rem; color:#888; margin-top:6px; }
  .bar-chart .bar-count{ font-size:.62rem; color:var(--forest); font-weight:700; }

  .empty{ text-align:center; color:#888; padding:30px; }

  /* ---------- ORDER CARDS ---------- */
  .orders-list{ display:flex; flex-direction:column; gap:12px; }
  .order-card{
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px;
  }
  .order-card.delivered{ opacity:.7; }
  .oc-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:6px; }
  .oc-name{ font-weight:900; font-size:1rem; }
  .oc-time{ font-size:.72rem; color:#888; white-space:nowrap; }
  .oc-phone{ font-size:.82rem; color:var(--leaf); direction:ltr; text-align:left; margin-bottom:6px; }
  .oc-items{ font-size:.8rem; color:#555; white-space:pre-line; margin-bottom:8px; line-height:1.6; }
  .oc-bottom{ display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .oc-total{ font-weight:900; color:var(--pomegranate); font-size:1rem; }
  .oc-badges{ display:flex; gap:6px; flex-wrap:wrap; }
  .badge{ font-size:.66rem; font-weight:800; padding:3px 9px; border-radius:100px; }
  .badge-status{ background:#FFF3D6; color:#8a6a10; }
  .badge-status.delivered{ background:#DFF2E1; color:#1e6b2b; }
  .badge-points{ background:#EFE7FB; color:#6b3fa0; }
  .badge-first{ background:rgba(161,58,46,.12); color:var(--pomegranate); }
  .badge-gps{ background:rgba(201,154,46,.15); color:#8a6a10; }
  .confirm-btn{
    background:var(--leaf); color:#fff; border:none; padding:9px 18px; border-radius:100px;
    font-weight:800; font-size:.78rem; cursor:pointer; width:100%; margin-top:10px;
  }
  .confirm-btn:disabled{ background:#ccc; cursor:not-allowed; }
  .confirm-btn.done{ background:#DFF2E1; color:#1e6b2b; }

  /* ---------- CUSTOMERS TABLE ---------- */
  table{ width:100%; border-collapse:collapse; background:var(--card); border-radius:14px; overflow:hidden; border:1px solid var(--line); font-size:.8rem; }
  th, td{ padding:10px 8px; text-align:right; border-bottom:1px solid var(--line); }
  th{ background:var(--forest); color:var(--gold-light); font-weight:700; }
  tr:last-child td{ border-bottom:none; }
  .scroll-x{ overflow-x:auto; }
  .pts-cell{ font-weight:900; color:var(--pomegranate); }

  .search-input{
    width:100%; border:1.5px solid var(--line); border-radius:100px; padding:10px 16px;
    font-size:.85rem; margin-bottom:14px;
  }
</style>
</head>
<body>

  <div class="topbar">
    <h1 class="display">📊 لوحة جنة الفواكه</h1>
    <div class="status-row"><span class="dot"></span> تحديث تلقائي مستمر — <span id="lastUpdate"></span></div>
    <button class="sound-toggle" id="soundBtn">🔔 تفعيل صوت التنبيه</button>
  </div>

  <div class="tabs">
    <button class="active" data-view="overview">📦 الطلبات</button>
    <button data-view="customers">👥 الزبائن</button>
  </div>

  <div class="setup-box" id="setupBox" style="display:none;">
    ⚠️ ما ضبطنا رابط Google Sheets بعد — حط رابط Apps Script بمتغير <code>GOOGLE_SCRIPT_URL</code> بأعلى الملف.
  </div>

  <!-- ================= OVERVIEW VIEW ================= -->
  <div class="view active" id="view-overview">
    <div class="stats-row" id="statsRow"></div>

    <div class="section">
      <h2>📅 آخر 7 أيام</h2>
      <div class="bar-chart" id="weekChart"></div>
    </div>

    <div class="section">
      <h2>📲 استخدام التطبيق</h2>
      <div class="stats-row" id="appStatsRow" style="margin:0;"></div>
    </div>

    <div class="section">
      <h2>🧾 أحدث الطلبات (آخر 30)</h2>
      <div class="orders-list" id="ordersList"></div>
    </div>
  </div>

  <!-- ================= CUSTOMERS VIEW ================= -->
  <div class="view" id="view-customers">
    <div class="section">
      <h2>👥 كل الزبائن ونقاطهم</h2>
      <input type="text" class="search-input" id="customerSearch" placeholder="دوّر باسم أو رقم هاتف...">
      <div class="scroll-x">
        <table>
          <thead>
            <tr><th>الاسم</th><th>الهاتف</th><th>النقاط</th><th>إجمالي الصرف</th></tr>
          </thead>
          <tbody id="customersBody"></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
  // ⚠️ حط هنا نفس رابط Google Apps Script المستخدم بملف index.html
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxs_MKe9t1O6ghLWA5G44OrB69A23m1RayxrfZ0HpblHHG2NRxRRkpljbHWTfYPWAHp/exec";

  const REFRESH_INTERVAL = 15000;
  let allCustomers = [];
  let soundEnabled = false;
  let lastOrderCount = null;
  let audioCtx = null;
  let sirenOsc = null;

  function stopSiren(){
    if(sirenOsc){
      try{ sirenOsc.stop(); }catch(e){}
      try{ sirenOsc.disconnect(); }catch(e){}
      sirenOsc = null;
    }
  }

  // صوت إنذار مستمر وحاد (يشبه صفارة) — تلقائياً 30 ثانية عند طلب جديد،
  // أو مدة قصيرة (2 ثانية) لما تضغط زر التجربة يدوياً
  function playBeep(totalDuration, forceTest){
    if(!soundEnabled && !forceTest) return;
    totalDuration = totalDuration || 30;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === "suspended") audioCtx.resume();
      stopSiren();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sawtooth"; // موجة حادة وقوية، مو ناعمة
      gain.gain.setValueAtTime(0.9, audioCtx.currentTime); // صوت عالي جداً
      osc.connect(gain); gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      const cycle = 0.45; // نصف صعود نصف نزول = صفارة مستمرة
      let t = now;
      osc.frequency.setValueAtTime(650, t);
      while(t < now + totalDuration){
        osc.frequency.linearRampToValueAtTime(1300, t + cycle/2);
        osc.frequency.linearRampToValueAtTime(650, t + cycle);
        t += cycle;
      }
      osc.start(now);
      osc.stop(now + totalDuration);
      osc.onended = ()=>{ if(sirenOsc === osc) sirenOsc = null; };
      sirenOsc = osc;
    }catch(e){ console.warn("siren failed", e); }
  }

  document.getElementById("soundBtn").addEventListener("click", ()=>{
    soundEnabled = !soundEnabled;
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume();
    const btn = document.getElementById("soundBtn");
    btn.textContent = soundEnabled ? "🔕 إيقاف الصوت" : "🔔 تفعيل صوت التنبيه";
    btn.classList.toggle("on", soundEnabled);
    stopSiren();
    if(soundEnabled) playBeep(2, true); // صوت تجربة قصير عشان تتأكد الصوت شغّال
  });

  // أي ضغطة بالصفحة (غير زر الصوت نفسه) توقف الصفارة فوراً —
  // بمجرد ما تلمس الشاشة، الصوت يسكت
  document.addEventListener("click",(e)=>{
    if(e.target.id === "soundBtn") return;
    stopSiren();
  });

  function money(n){ return Math.round(n||0).toLocaleString('en-US') + " د.ع"; }
  function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
  function startOfWeek(d){ const x=startOfDay(d); x.setDate(x.getDate()-x.getDay()); return x; }
  function startOfMonth(d){ const x=new Date(d); x.setDate(1); x.setHours(0,0,0,0); return x; }

  // ---------- TABS ----------
  document.querySelectorAll(".tabs button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
      document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("view-"+btn.dataset.view).classList.add("active");
    });
  });

  function renderAppStats(a){
    const stats = [
      { lbl:"إجمالي الزيارات", val: a.visits ?? 0 },
      { lbl:"زيارات اليوم", val: a.visitsToday ?? 0 },
      { lbl:"إجمالي التثبيتات", val: a.installs ?? 0 },
      { lbl:"تثبيتات اليوم", val: a.installsToday ?? 0 },
    ];
    document.getElementById("appStatsRow").innerHTML = stats.map(s => `
      <div class="stat-card"><div class="lbl">${s.lbl}</div><div class="val">${s.val}</div></div>
    `).join("");
  }

  function renderStats(orders){
    const now = new Date();
    const today = orders.filter(o => new Date(o.time) >= startOfDay(now));
    const week = orders.filter(o => new Date(o.time) >= startOfWeek(now));
    const month = orders.filter(o => new Date(o.time) >= startOfMonth(now));
    const sum = arr => arr.reduce((s,o)=>s+Number(o.total||0),0);

    const stats = [
      { lbl:"طلبات اليوم", val: today.length },
      { lbl:"مبيعات اليوم", val: money(sum(today)), money:true },
      { lbl:"طلبات الأسبوع", val: week.length },
      { lbl:"مبيعات الأسبوع", val: money(sum(week)), money:true },
      { lbl:"طلبات الشهر", val: month.length },
      { lbl:"مبيعات الشهر", val: money(sum(month)), money:true },
    ];
    document.getElementById("statsRow").innerHTML = stats.map(s => `
      <div class="stat-card"><div class="lbl">${s.lbl}</div><div class="val ${s.money?'money':''}">${s.val}</div></div>
    `).join("");
  }

  function renderWeekChart(orders){
    const days = [];
    for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(startOfDay(d)); }
    const counts = days.map(day=>{
      const next=new Date(day); next.setDate(next.getDate()+1);
      return orders.filter(o=>{ const t=new Date(o.time); return t>=day && t<next; }).length;
    });
    const max = Math.max(1, ...counts);
    const labels = ["أحد","اثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"];
    document.getElementById("weekChart").innerHTML = days.map((day,i)=>{
      const h = Math.round((counts[i]/max)*100);
      return `<div class="bar-col">
        <div class="bar-count">${counts[i]}</div>
        <div class="bar" style="height:${Math.max(h,3)}%"></div>
        <div class="bar-label">${labels[day.getDay()]}</div>
      </div>`;
    }).join("");
  }

  async function confirmDelivery(orderId, btnEl){
    btnEl.disabled = true;
    btnEl.textContent = "⏳ جاري التأكيد...";
    try{
      const res = await fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ action: "confirmDelivery", orderId })
      });
      const data = await res.json();
      if(data.status === "ok"){
        btnEl.textContent = "✅ تم التأكيد — أُضيفت النقاط";
        btnEl.classList.add("done");
        setTimeout(loadData, 1200);
      }else{
        btnEl.textContent = "⚠️ صار خطأ، حاول مجدداً";
        btnEl.disabled = false;
      }
    }catch(e){
      btnEl.textContent = "⚠️ تعذّر الاتصال";
      btnEl.disabled = false;
    }
  }

  function renderOrdersList(orders){
    const sorted = [...orders].sort((a,b)=> new Date(b.time) - new Date(a.time)).slice(0,30);
    const list = document.getElementById("ordersList");
    if(sorted.length===0){
      list.innerHTML = `<p class="empty">لا توجد طلبات مسجّلة بعد</p>`;
      return;
    }
    list.innerHTML = sorted.map(o=>{
      const d = new Date(o.time);
      const timeStr = d.toLocaleString('ar-IQ', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
      const isDelivered = (o.status||"").trim() === "تم التسليم";
      const isGps = (o.approxLocation||"").includes("دقيق");
      const badges = `
        <span class="badge badge-status ${isDelivered?'delivered':''}">${o.status || "قيد المراجعة"}</span>
        <span class="badge badge-points">⭐ ${o.pointsEarned||0} نقطة</span>
        ${o.firstOrder === "نعم" ? '<span class="badge badge-first">🎁 أول طلب</span>' : ''}
        ${isGps ? '<span class="badge badge-gps">📍 دقيق</span>' : ''}
      `;
      const btn = isDelivered
        ? `<button class="confirm-btn done" disabled>✅ تم التسليم</button>`
        : `<button class="confirm-btn" onclick="confirmDelivery('${o.orderId}', this)">✅ تأكيد الاستلام</button>`;
      return `
      <div class="order-card ${isDelivered?'delivered':''}">
        <div class="oc-top">
          <div class="oc-name">${o.name || "بدون اسم"}</div>
          <div class="oc-time">${timeStr}</div>
        </div>
        <div class="oc-phone">📞 ${o.phone || "—"}</div>
        <div class="oc-items">${(o.items||"").replace(/\|/g,"\n")}</div>
        <div class="oc-bottom">
          <div class="oc-total">${money(o.total)}</div>
          <div class="oc-badges">${badges}</div>
        </div>
        ${btn}
      </div>`;
    }).join("");
  }

  function renderCustomersTable(customers, filterText){
    const term = (filterText||"").trim().toLowerCase();
    const filtered = customers.filter(c=>
      !term || (c.name||"").toLowerCase().includes(term) || String(c.phone||"").includes(term)
    );
    const sorted = [...filtered].sort((a,b)=> Number(b.points||0) - Number(a.points||0));
    const body = document.getElementById("customersBody");
    if(sorted.length===0){
      body.innerHTML = `<tr><td colspan="4" class="empty">لا يوجد زبائن مسجّلين بعد</td></tr>`;
      return;
    }
    body.innerHTML = sorted.map(c=>`
      <tr>
        <td>${c.name || "—"}</td>
        <td style="direction:ltr; text-align:left;">${c.phone || "—"}</td>
        <td class="pts-cell">${c.points || 0}</td>
        <td>${money(c.totalSpend)}</td>
      </tr>
    `).join("");
  }

  document.getElementById("customerSearch").addEventListener("input",(e)=>{
    renderCustomersTable(allCustomers, e.target.value);
  });

  async function loadData(){
    if(!GOOGLE_SCRIPT_URL){
      document.getElementById("setupBox").style.display = "block";
      return;
    }
    try{
      const res = await fetch(GOOGLE_SCRIPT_URL, { cache:"no-store" });
      const orders = await res.json();

      if(lastOrderCount !== null && orders.length > lastOrderCount){
        playBeep();
      }
      lastOrderCount = orders.length;

      renderStats(orders);
      renderWeekChart(orders);
      renderOrdersList(orders);

      const res2 = await fetch(`${GOOGLE_SCRIPT_URL}?analyticsSummary=1`, { cache:"no-store" });
      renderAppStats(await res2.json());

      const res3 = await fetch(`${GOOGLE_SCRIPT_URL}?customersList=1`, { cache:"no-store" });
      allCustomers = await res3.json();
      renderCustomersTable(allCustomers, document.getElementById("customerSearch").value);

      document.getElementById("lastUpdate").textContent =
        new Date().toLocaleTimeString('ar-IQ', { hour:'2-digit', minute:'2-digit' });
    }catch(e){
      console.error(e);
    }
  }

  loadData();
  setInterval(loadData, REFRESH_INTERVAL);
</script>
</body>
</html>
