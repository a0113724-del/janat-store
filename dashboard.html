<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقارير الطلبات — جنة الفواكه والخضار</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#153122; --forest-2:#1E4530;
    --leaf:#3E7A44; --gold:#C99A2E; --gold-light:#E9CD86;
    --paper:#F6F1E1; --card:#FFFFFF;
    --pomegranate:#A13A2E; --ink:#1C2A1D;
    --line: rgba(62,122,68,.18);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Tajawal', sans-serif; background:var(--paper); color:var(--ink); line-height:1.5; padding-bottom:50px; }
  .display{ font-family:'Aref Ruqaa', serif; }

  .topbar{
    background:linear-gradient(180deg, var(--forest), var(--forest-2)); color:var(--gold-light);
    padding:20px; text-align:center;
  }
  .topbar h1{ font-size:1.3rem; }
  .topbar .sub{ font-size:.76rem; color:#DCE7DA; opacity:.85; margin-top:4px; }

  .setup-box{
    max-width:700px; margin:20px auto; background:#FFF3D6; border:1.5px dashed var(--gold);
    border-radius:14px; padding:18px; font-size:.85rem; text-align:center;
  }
  .setup-box code{
    display:block; background:#fff; border-radius:8px; padding:10px; margin-top:10px;
    font-size:.76rem; word-break:break-all; direction:ltr; text-align:left;
  }

  .stats-row{
    max-width:900px; margin:20px auto; padding:0 16px;
    display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px;
  }
  .stat-card{
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; text-align:center;
  }
  .stat-card .lbl{ font-size:.76rem; color:#888; margin-bottom:6px; }
  .stat-card .val{ font-size:1.5rem; font-weight:900; color:var(--forest); }
  .stat-card .val.money{ color:var(--pomegranate); }

  .section{ max-width:900px; margin:24px auto; padding:0 16px; }
  .section h2{ font-size:1.05rem; color:var(--forest); margin-bottom:12px; }

  .bar-chart{ display:flex; align-items:flex-end; gap:8px; height:140px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .bar-chart .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .bar-chart .bar{ width:100%; max-width:28px; background:var(--leaf); border-radius:4px 4px 0 0; min-height:2px; }
  .bar-chart .bar-label{ font-size:.62rem; color:#888; margin-top:6px; }
  .bar-chart .bar-count{ font-size:.62rem; color:var(--forest); font-weight:700; }

  table{ width:100%; border-collapse:collapse; background:var(--card); border-radius:14px; overflow:hidden; border:1px solid var(--line); font-size:.78rem; }
  th, td{ padding:9px 8px; text-align:right; border-bottom:1px solid var(--line); }
  th{ background:var(--forest); color:var(--gold-light); font-weight:700; }
  tr:last-child td{ border-bottom:none; }
  .flag{ color:var(--pomegranate); font-weight:800; }
  .empty{ text-align:center; color:#888; padding:30px; }
  .refresh-btn{
    display:block; margin:20px auto 0; background:var(--leaf); color:#fff; border:none;
    padding:11px 24px; border-radius:100px; font-weight:800; font-size:.85rem; cursor:pointer;
  }
  .scroll-x{ overflow-x:auto; }
</style>
</head>
<body>

  <div class="topbar">
    <h1 class="display">📊 تقارير الطلبات</h1>
    <div class="sub">جنة الفواكه والخضار</div>
  </div>

  <div class="setup-box" id="setupBox" style="display:none;">
    ⚠️ ما ضبطنا رابط Google Sheets بعد.<br>
    افتح ملف <b>dashboard.html</b> وحط رابط Apps Script بمتغير <code>GOOGLE_SCRIPT_URL</code> بالأعلى.
  </div>

  <div class="stats-row" id="statsRow"></div>

  <div class="section">
    <h2>📅 آخر 7 أيام</h2>
    <div class="bar-chart" id="weekChart"></div>
  </div>

  <div class="section">
    <h2>🧾 أحدث الطلبات</h2>
    <div class="scroll-x">
      <table id="ordersTable">
        <thead>
          <tr>
            <th>الوقت</th><th>الاسم</th><th>الهاتف</th><th>الموقع التقريبي</th><th>المجموع</th>
          </tr>
        </thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </div>
  </div>

  <button class="refresh-btn" id="refreshBtn">🔄 تحديث البيانات</button>

<script>
  // ⚠️ حط هنا نفس رابط Google Apps Script المستخدم بملف index.html
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxs_MKe9t1O6ghLWA5G44OrB69A23m1RayxrfZ0HpblHHG2NRxRRkpljbHWTfYPWAHp/exec";

  function money(n){ return Math.round(n||0).toLocaleString('en-US') + " د.ع"; }

  function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
  function startOfWeek(d){
    const x = startOfDay(d);
    const day = x.getDay(); // 0=Sunday
    x.setDate(x.getDate()-day);
    return x;
  }
  function startOfMonth(d){ const x=new Date(d); x.setDate(1); x.setHours(0,0,0,0); return x; }

  function renderStats(orders){
    const now = new Date();
    const todayStart = startOfDay(now);
    const weekStart = startOfWeek(now);
    const monthStart = startOfMonth(now);

    const today = orders.filter(o => new Date(o.time) >= todayStart);
    const week = orders.filter(o => new Date(o.time) >= weekStart);
    const month = orders.filter(o => new Date(o.time) >= monthStart);

    const sum = arr => arr.reduce((s,o)=>s+Number(o.total||0),0);

    const stats = [
      { lbl:"طلبات اليوم", val: today.length },
      { lbl:"مبيعات اليوم", val: money(sum(today)), money:true },
      { lbl:"طلبات الأسبوع", val: week.length },
      { lbl:"مبيعات الأسبوع", val: money(sum(week)), money:true },
      { lbl:"طلبات الشهر", val: month.length },
      { lbl:"مبيعات الشهر", val: money(sum(month)), money:true },
    ];

    document.getElementById("statsRow").innerHTML = stats.map(s => `
      <div class="stat-card">
        <div class="lbl">${s.lbl}</div>
        <div class="val ${s.money?'money':''}">${s.val}</div>
      </div>
    `).join("");
  }

  function renderWeekChart(orders){
    const days = [];
    for(let i=6;i>=0;i--){
      const d = new Date();
      d.setDate(d.getDate()-i);
      days.push(startOfDay(d));
    }
    const counts = days.map(day=>{
      const next = new Date(day); next.setDate(next.getDate()+1);
      return orders.filter(o=>{
        const t = new Date(o.time);
        return t >= day && t < next;
      }).length;
    });
    const max = Math.max(1, ...counts);
    const labels = ["أحد","اثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"];

    document.getElementById("weekChart").innerHTML = days.map((day,i)=>{
      const h = Math.round((counts[i]/max)*100);
      return `
      <div class="bar-col">
        <div class="bar-count">${counts[i]}</div>
        <div class="bar" style="height:${Math.max(h,3)}%"></div>
        <div class="bar-label">${labels[day.getDay()]}</div>
      </div>`;
    }).join("");
  }

  function renderTable(orders){
    const sorted = [...orders].sort((a,b)=> new Date(b.time) - new Date(a.time)).slice(0,30);
    const body = document.getElementById("ordersBody");
    if(sorted.length===0){
      body.innerHTML = `<tr><td colspan="5" class="empty">لا توجد طلبات مسجّلة بعد</td></tr>`;
      return;
    }
    body.innerHTML = sorted.map(o=>{
      const d = new Date(o.time);
      const timeStr = d.toLocaleString('ar-IQ', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
      const loc = (o.approxLocation||"").includes("دقيق")
        ? `<span class="flag">📍 دقيق</span>`
        : (o.approxLocation || "—");
      return `
      <tr>
        <td>${timeStr}</td>
        <td>${o.name||"—"}</td>
        <td>${o.phone||"—"}</td>
        <td>${loc}</td>
        <td>${money(o.total)}</td>
      </tr>`;
    }).join("");
  }

  async function loadData(){
    if(!GOOGLE_SCRIPT_URL){
      document.getElementById("setupBox").style.display = "block";
      renderStats([]);
      renderWeekChart([]);
      renderTable([]);
      return;
    }
    try{
      const res = await fetch(GOOGLE_SCRIPT_URL);
      const orders = await res.json();
      renderStats(orders);
      renderWeekChart(orders);
      renderTable(orders);
    }catch(e){
      console.error(e);
      document.getElementById("ordersBody").innerHTML =
        `<tr><td colspan="5" class="empty">تعذّر تحميل البيانات، تأكد من الرابط والاتصال</td></tr>`;
    }
  }

  document.getElementById("refreshBtn").addEventListener("click", loadData);
  loadData();
</script>
</body>
</html>
